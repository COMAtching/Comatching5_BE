# ============================================================
# Gradle 빌드 설정.
#
# 여기 없던 시절에는 전부 기본값이었다. 기본값은 "모듈 7개를 한 줄로 세워
# 차례로 돌린다"는 뜻이고, 서비스끼리 의존이 없는 이 저장소에서는 그만큼
# 러너 시간을 그냥 버리는 것이었다.
# ============================================================

# common-module 을 뺀 서비스 6개는 서로 의존하지 않는다. 동시에 돌린다.
org.gradle.parallel=true

# 입력이 그대로면 결과를 다시 만들지 않는다. PR 에 커밋을 여러 번 올릴 때
# 손대지 않은 모듈의 테스트까지 매번 다시 도는 것을 막는다.
# gradle/actions/setup-gradle 이 이 캐시를 실행 간에 이어준다.
org.gradle.caching=true

# 모듈을 병렬로 돌리면 JVM 도 그만큼 뜬다. 기본 힙으로는 부족해서
# 컴파일 도중 OOM 이 나기 시작한다.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
