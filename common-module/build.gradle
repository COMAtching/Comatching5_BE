plugins {
	id 'java-library'
}

description = 'common-module'

ext {
	queryDslVersion = "5.0.0"
	set('springCloudVersion', "2025.0.1")
}

bootJar { enabled = false }
jar { enabled = true }

def querydslDir = "$buildDir/generated/querydsl"

sourceSets {
	main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile) {
	options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

tasks.named('clean') {
	delete file(querydslDir)
}

dependencies {
	// queryDSL
	implementation "com.querydsl:querydsl-jpa:${queryDslVersion}:jakarta"
	annotationProcessor "com.querydsl:querydsl-apt:${queryDslVersion}:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	// Web (GlobalExceptionHandler 등을 위해 필요)
	api 'org.springframework.boot:spring-boot-starter-web'
	api 'org.springframework.boot:spring-boot-starter-validation'

	// JSON 처리 (ObjectMapper 등)
	api 'com.fasterxml.jackson.core:jackson-databind'

	// Swagger (OpenAPI)
	api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
	api 'org.webjars:swagger-ui:5.31.0'

	// jpa
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// jwt
	api 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// security
	api 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.security:spring-security-test'

	// aws s3
	api 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.0.2'

	// feign
	api 'org.springframework.cloud:spring-cloud-starter-openfeign'

	// kafka
	api 'org.springframework.kafka:spring-kafka'

	// 재시도·DLT 정책은 공통 모듈이 소유하므로 검증도 여기서 한다.
	// 실제 브로커(EmbeddedKafka) 없이는 "몇 번 재시도하고 어디로 보냈는지"를
	// 확인할 수 없다.
	testImplementation 'org.springframework.kafka:spring-kafka-test'

	// redisson
	api 'org.redisson:redisson-spring-boot-starter:3.27.0'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}