# Feign 내부 호출 공통 타임아웃 설정.
# Feign 클라이언트를 쓰는 서비스의 application.yml 에서
# spring.config.import: classpath:feign-resilience.yml 로 불러온다.
# 값이 이 파일 한 곳에만 존재해야 서비스 간 설정 드리프트가 안 생긴다.
#
# 같은 EC2 호스트 안의 내부 REST 호출 전제라 공격적으로 잡는다.
# OpenFeign 기본값(connect 10s / read 60s)은 피호출 서비스가 멈추면
# 호출 서비스의 톰캣 스레드를 60초씩 붙잡아 장애를 그대로 전파한다.
#
# 두 값은 항목별로 독립 상속된다. FeignClientFactoryBean 은 default 블록을
# 먼저 적용해 필드를 채운 뒤 클라이언트별 블록을 덧씌우는데, 클라이언트
# 블록에 없는 항목은 앞 단계 값을 그대로 유지한다 —
# read-timeout 만 적어도 connect 는 default 의 1s 가 남는다.
# 아래에서 항목마다 두 값을 다 적는 건 유효 타임아웃을 한눈에 읽기 위한
# 관례일 뿐 동작상 필수는 아니다. (키는 @FeignClient 의 name/contextId, 단위 ms)
spring:
  cloud:
    openfeign:
      # 모든 Feign 호출을 서킷브레이커로 감싼다. 브레이커 이름은 메서드 단위가
      # 아니라 Feign 클라이언트(name) 단위로 묶는다 — InternalFeignConfig 의
      # CircuitBreakerNameResolver 참고.
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 3000
          # 배치성 호출은 읽기 시간을 더 준다.
          user-service: # POST /profiles/bulk (matching·chat 공용)
            connect-timeout: 1000
            read-timeout: 5000
          chat-service: # POST /references, /ensure — 매칭 이력 일괄 조회·생성
            connect-timeout: 1000
            read-timeout: 5000
          user-service-admin: # 관리자 페이징 조회
            connect-timeout: 1000
            read-timeout: 5000
    circuitbreaker:
      resilience4j:
        # 호출 스레드에서 그대로 실행한다(세마포어 방식). 스레드풀 실행을 켜두면
        # ① Spring Cloud 기본 TimeLimiter(1s)가 위의 read-timeout 보다 먼저
        # 호출을 끊고 ② EC2 한 대에 6개 JVM 이 뜨는 전제에서 서비스마다
        # 스레드풀이 하나씩 늘어난다. 끄면 Feign read-timeout 이 유일한
        # 시간 상한이 된다.
        disable-thread-pool: true

resilience4j:
  circuitbreaker:
    configs:
      # 모든 브레이커(= Feign 클라이언트 단위)의 공통값. 클라이언트별로 바꾸려면
      # resilience4j.circuitbreaker.instances.<Feign name> 으로 오버라이드한다.
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        # 내부 호출은 클라이언트별 트래픽이 적다. 이 값에 못 미치면 브레이커가
        # 영영 안 열리므로 낮게 잡는다.
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        # read-timeout(3s)까지 가기 전에 "느려짐"을 먼저 감지한다.
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # 4xx 는 피호출 서비스가 정상 동작하며 내린 판정(없는 리소스, 잘못된
        # 요청)이라 장애 신호가 아니다. 실패율에 넣으면 비즈니스 에러가
        # 브레이커를 열어 멀쩡한 서비스로 가는 호출까지 차단한다.
        ignore-exceptions:
          - feign.FeignException$FeignClientException
