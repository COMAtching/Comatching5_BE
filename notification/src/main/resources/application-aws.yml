# AWS 환경: RDS와 Docker 서비스 주소. SPRING_PROFILES_ACTIVE=aws
spring:
  kafka:
    bootstrap-servers: kafka:29092
    admin:
      # KafkaAdmin 은 기동 시 선언된 토픽을 만든다. 기본값(false)이면 브로커에
      # 못 붙어도 경고만 남기고 앱이 정상 기동해서, 토픽이 없는 채로 "성공한"
      # 배포가 되고 발행·구독이 런타임에 조용히 실패한다. true 면 그 자리에서
      # 컨텍스트 로딩이 깨져 배포 시점에 드러난다.
      fail-fast: true
  data:
    redis:
      host: ${REDIS_ENDPOINT}
      port: 6379
      ssl:
        # ElastiCache(전송 중 암호화 켬)면 true, EC2 컨테이너 Redis 면 false.
        enabled: ${REDIS_SSL_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        # 컨테이너 밖(호스트 포트 매핑·게이트웨이 라우트)으로 나가는 길이
        # 없는 포트라 그대로 연다. Prometheus 가 컴포즈 네트워크 안에서 긁는다.
        include: health,prometheus
  endpoint:
    health:
      # 상태 상세 노출 여부는 실행 환경별로 지정한다.
      show-details: never

# FCM 서비스 계정 키. 이미지에 굽지 않고 .env.prod 의 env 로 주입받는다.
# required: 키가 없으면 기동을 깨서 배포 시점에 드러낸다(kafka.admin.fail-fast 와 같은 철학).
fcm:
  required: true
