# 공통 설정만 정의한다. 프로파일은 env의 SPRING_PROFILES_ACTIVE로 선택한다.
server:
  port: 9005

spring:
  application:
    name: notification
  kafka:
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      type: single
      ack-mode: record
      concurrency: 1
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.comatching.common.config.kafka.EventValueSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
  mail:
    host: smtp.gmail.com
    port: 587
    username: catholicalarm2@gmail.com
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 15000
          writetimeout: 15000
          starttls:
            enable: true

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # percentiles(서비스별 고정 분위수)가 아니라 histogram 버킷을 내보낸다.
      # 전자는 인스턴스 간 합산이 불가능해 전체 p95를 뽑을 수 없다.
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s

# 그룹별 DLT와 전용 replay 토픽을 기동 시 만든다.
# KafkaEventRoute에 등록된 이 서비스의 처리 경로만 적는다.
comatching:
  kafka:
    dlt-routes: SIGNUP_MAIL,WITHDRAW_MAIL,CHAT_NOTIFICATION,ITEMS_GRANTED_MAIL,ITEMS_GRANTED_PUSH,REFUND_MAIL
    # DLT 적재를 알릴 웹훅(Discord/Slack 겸용). 비우면 로그만 남는다.
    dlt-alert-webhook-url: ${DLT_ALERT_WEBHOOK_URL:}

# /api/internal/** 를 지키는 InternalApiAuthenticationFilter 의 검사 토큰.
# 비우면 내부 API 전체가 401 로 닫힌다(fail-closed).
internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:}

# FCM 서비스 계정 키는 env로 주입한다. 키 필수 여부는 환경 파일에서 지정한다.
fcm:
  service-account-b64: ${FCM_SERVICE_ACCOUNT_B64:}
