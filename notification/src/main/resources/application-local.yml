# 로컬 환경: 노트북 MySQL과 localhost 서비스. SPRING_PROFILES_ACTIVE=local
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # 상태 상세 노출 여부는 실행 환경별로 지정한다.
      show-details: always

# FCM 서비스 계정 키. 이미지에 굽지 않고 .env.prod 의 env 로 주입받는다.
# required: 키가 없으면 기동을 깨서 배포 시점에 드러낸다(kafka.admin.fail-fast 와 같은 철학).
fcm:
  required: ${FCM_REQUIRED:false}

spring:
  datasource:
    url: jdbc:mysql://${LOCAL_MYSQL_HOST:127.0.0.1}:${LOCAL_MYSQL_PORT:3306}/comatching_notification?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${LOCAL_MYSQL_USERNAME:root}
    password: ${LOCAL_MYSQL_PASSWORD:}
  config:
    import: classpath:local-infrastructure.yml

user-service:
  url: http://localhost:9000

chat-service:
  url: http://localhost:9003
