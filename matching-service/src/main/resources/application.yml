# 공통 설정만 정의한다. 프로파일은 env의 SPRING_PROFILES_ACTIVE로 선택한다.
server:
  port: 9001

spring:
  application:
    name: matching-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariPool-${spring.application.name}
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
      validation-timeout: 5000
  jpa:
    # OSIV 를 끈다 (회차 9 실측). 켜져 있으면 요청 중 첫 DB 접근에서 잡은
    # 커넥션을 "요청 끝"까지 놓지 않는다 — 트랜잭션 경계를 그어도 소용없음을
    # 체크아웃 횟수(요청당 정확히 1회, 점유 350~420ms vs 순수 SQL ~25ms)로
    # 확인했다. 풀 10개 ÷ 0.35s ≈ 29 RPS 가 매칭 처리량 상한이 된 원인.
    # 끄기 전 전수 확인: 웹 경로에서 트랜잭션 밖 lazy 접근 0건
    # (LAZY 인 hobbyCategories 는 SQL 점수식·@Transactional 컨슈머에서만 사용).
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.comatching.common.config.kafka.EventValueSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
    consumer:
      group-id: matching-candidate-sync-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        "[partition.assignment.strategy]": org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    listener:
      type: single
      ack-mode: record
      concurrency: 1
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${AWS_S3_BUCKET}
  # Feign 내부 호출 타임아웃 공통값 (common-module 소유)
  config:
    import: classpath:feign-resilience.yml

matching:
  outbox:
    enabled: true
    poll-interval-ms: 1000
  kafka:
    # member-withdraw · profile-updates 리스너 병렬도. 상한은 파티션 수(3) —
    # 넘는 값은 유휴 스레드만 만든다. 트래픽·인스턴스 수를 보고 조정한다.
    candidate-listener-concurrency: 3
  tombstone:
    # 이 기간에는 탈퇴 표식으로 늦은 갱신을 거른다. 표식 정리 후 후보 생성 시 회원 상태를 다시 확인한다.
    retention-days: 2
    cleanup-cron: 0 0 4 * * *

jwt:
  secret: ${JWT_SECRET}
  access-token:
    expiration: ${ACCESS_TOKEN_EXP:86400000}
  refresh-token:
    expiration: ${REFRESH_TOKEN_EXP:604800000}

internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # percentiles(서비스별 고정 분위수)가 아니라 histogram 버킷을 내보낸다.
      # 전자는 인스턴스 간 합산이 불가능해 전체 p95를 뽑을 수 없다.
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s

# 그룹별 DLT와 전용 replay 토픽을 기동 시 만든다.
# KafkaEventRoute에 등록된 이 서비스의 처리 경로만 적는다.
comatching:
  outbox:
    cleanup-target: MATCHING
    cleanup-cron: "0 10 3 * * *"  # Asia/Seoul
  kafka:
    dlt-routes: CANDIDATE_WITHDRAW,CANDIDATE_PROFILE
    # DLT 적재를 알릴 웹훅(Discord/Slack 겸용). 비우면 로그만 남는다.
    dlt-alert-webhook-url: ${DLT_ALERT_WEBHOOK_URL:}
