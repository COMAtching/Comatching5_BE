# AWS 환경: RDS와 Docker 서비스 주소. SPRING_PROFILES_ACTIVE=aws
spring:
  data:
    redis:
      host: ${REDIS_ENDPOINT}
      port: ${REDIS_PORT:6379}
      ssl:
        # ElastiCache(전송 중 암호화 켬)면 true, EC2 컨테이너 Redis 면 false.
        enabled: ${REDIS_SSL_ENABLED:true}
  cloud:
    gateway:
      server:
        webflux:
          # CORS 설정
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins:
                  - https://comatching.site
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
          # Swagger는 SWAGGER_PATH_PREFIX 미설정 시 /__swagger-off__ 아래로 숨긴다.
          # 공개하려면 .env.prod에 SWAGGER_PATH_PREFIX= (빈 값)를 설정한다.
          # Swagger 라우트의 AuthorizationHeaderFilter는 제거하지 않는다.
          # RewritePath로 내부 API에 접근하더라도 사용자 헤더 검증을 거쳐야 한다.
          routes:
            - id: item-service-admin-monitor
              uri: http://item-service:9006
              predicates:
                - Path=/admin-payment-monitor.html
            - id: item-service-payment-ws
              uri: http://item-service:9006
              predicates:
                - Path=/ws/payment, /ws/payment/**
              filters:
                - AuthorizationHeaderFilter
            - id: user-service-protected
              uri: http://user-service:9000
              predicates:
                - Path=/api/auth/signup/profile, /api/auth/logout, /api/auth/password/change, /api/auth/withdraw, /api/members/**, /api/notices/**, /api/v1/notices/**
              filters:
                - AuthorizationHeaderFilter
            - id: admin-user-notice
              uri: http://user-service:9000
              predicates:
                - Path=/api/v1/admin/users, /api/v1/admin/users/**, /api/v1/admin/notices, /api/v1/admin/notices/**
              filters:
                - AuthorizationHeaderFilter
            - id: user-service-public
              uri: http://user-service:9000
              predicates:
                - Path=/api/auth/login, /api/auth/signup, /api/auth/signup/nickname/availability, /api/auth/participants, /api/auth/participants/**, /api/auth/email/**, /api/auth/password/code, /api/auth/reissue, /api/profile/tags, /api/hobbies/categories, /api/public/profile-images/**, /oauth2/**, /login/**, /default-ui.css
            - id: user-service-swagger
              uri: http://user-service:9000
              predicates:
                - Path=${SWAGGER_PATH_PREFIX:/__swagger-off__}/user-doc/**
              filters:
                - AuthorizationHeaderFilter
                - RewritePath=${SWAGGER_PATH_PREFIX:/__swagger-off__}/user-doc/(?<segment>.*), /$\{segment}
            - id: matching-service
              uri: http://matching-service:9001
              predicates:
                - Path=/api/matching/**
              filters:
                - AuthorizationHeaderFilter
            - id: matching-service-swagger
              uri: http://matching-service:9001
              predicates:
                - Path=${SWAGGER_PATH_PREFIX:/__swagger-off__}/matching-doc/**
              filters:
                - AuthorizationHeaderFilter
                - RewritePath=${SWAGGER_PATH_PREFIX:/__swagger-off__}/matching-doc/(?<segment>.*), /$\{segment}
            - id: chat-service
              uri: http://chat-service:9003
              predicates:
                - Path=/api/chat/**, /ws/**
              filters:
                - AuthorizationHeaderFilter
            - id: chat-service-swagger
              uri: http://chat-service:9003
              predicates:
                - Path=${SWAGGER_PATH_PREFIX:/__swagger-off__}/chat-doc/**
              filters:
                - AuthorizationHeaderFilter
                - RewritePath=${SWAGGER_PATH_PREFIX:/__swagger-off__}/chat-doc/(?<segment>.*), /$\{segment}
            - id: item-service
              uri: http://item-service:9006
              predicates:
                - Path=/api/items/**, /api/v1/shop/**
              filters:
                - AuthorizationHeaderFilter
            - id: notification-service
              uri: http://notification:9005
              predicates:
                - Path=/api/fcm/**
              filters:
                - AuthorizationHeaderFilter
            - id: admin-payment-product-items
              uri: http://item-service:9006
              predicates:
                - Path=/api/v1/admin/shop/**, /api/v1/admin/payment/**, /api/v1/admin/roulette/**
              filters:
                - AuthorizationHeaderFilter

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # 상태 상세 노출 여부는 실행 환경별로 지정한다.
      show-details: never
  server:
    # 8080 은 nginx 가 TLS 를 종단해 넘겨주는 포트라, 라우트에 걸리지 않는
    # /actuator/** 를 게이트웨이 자신이 응답하면 그대로 외부에 공개된다.
    # 관리 엔드포인트를 8081 로 옮기고 호스트에 매핑하지 않는다 - 컴포즈
    # 네트워크 안(Prometheus 스크레이프, 헬스체크)에서만 닿는다.
    port: 8081
