# 로컬 환경: 노트북 MySQL과 localhost 서비스. SPRING_PROFILES_ACTIVE=local
spring:
  cloud:
    gateway:
      server:
        webflux:
          # 1. CORS 설정
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins:
                  - https://comatching.site
                  - http://localhost:3000
                  - http://localhost:5173
                  - http://localhost:5500
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
          # 2. 라우팅 규칙
          routes:
            - id: item-service-admin-monitor
              uri: http://localhost:9006
              predicates:
                - Path=/admin-payment-monitor.html
            - id: item-service-payment-ws
              uri: http://localhost:9006
              predicates:
                - Path=/ws/payment, /ws/payment/**
              filters:
                - AuthorizationHeaderFilter
            - id: user-service-public
              uri: http://localhost:9000
              predicates:
                - Path=/api/auth/login, /api/auth/signup, /api/auth/signup/nickname/availability, /api/auth/participants, /api/auth/participants/**, /api/auth/email/**, /api/auth/password/code, /api/auth/reissue, /api/profile/tags, /api/hobbies/categories, /api/public/profile-images/**, /oauth2/**, /login/**, /default-ui.css
            - id: user-service-protected
              uri: http://localhost:9000
              predicates:
                - Path=/api/auth/signup/profile, /api/auth/logout, /api/auth/password/change, /api/auth/withdraw, /api/members/**, /api/notices/**, /api/v1/notices/**
              filters:
                - AuthorizationHeaderFilter
            - id: user-service-swagger
              uri: http://localhost:9000
              predicates:
                - Path=/user-doc/**
              filters:
                - RewritePath=/user-doc/(?<segment>.*), /$\{segment}
            - id: matching-service
              uri: http://localhost:9001
              predicates:
                - Path=/api/matching/**
              filters:
                - AuthorizationHeaderFilter
            - id: matching-service-swagger
              uri: http://localhost:9001
              predicates:
                - Path=/matching-doc/**
              filters:
                - RewritePath=/matching-doc/(?<segment>.*), /$\{segment}
            - id: chat-service
              uri: http://localhost:9003
              predicates:
                - Path=/api/chat/**, /ws/**
              filters:
                - AuthorizationHeaderFilter
            - id: chat-service-swagger
              uri: http://localhost:9003
              predicates:
                - Path=/chat-doc/**
              filters:
                - RewritePath=/chat-doc/(?<segment>.*), /$\{segment}
            - id: item-service
              uri: http://localhost:9006
              predicates:
                - Path=/api/items/**, /api/v1/shop/**
              filters:
                - AuthorizationHeaderFilter
            - id: notification-service
              uri: http://localhost:9005
              predicates:
                - Path=/api/fcm/**
              filters:
                - AuthorizationHeaderFilter
            - id: admin-user-notice
              uri: http://localhost:9000
              predicates:
                - Path=/api/v1/admin/users, /api/v1/admin/users/**, /api/v1/admin/notices, /api/v1/admin/notices/**
              filters:
                - AuthorizationHeaderFilter
            - id: admin-payment-product-items
              uri: http://localhost:9006
              predicates:
                - Path=/api/v1/admin/shop/**, /api/v1/admin/payment/**, /api/v1/admin/roulette/**
              filters:
                - AuthorizationHeaderFilter
  config:
    import: classpath:local-infrastructure.yml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # 상태 상세 노출 여부는 실행 환경별로 지정한다.
      show-details: always
