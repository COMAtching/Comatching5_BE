server:
  port: 8080

spring:
  application:
    name: gateway-service

  data:
    redis:
      host: ${REDIS_ENDPOINT:localhost}
      port: ${REDIS_PORT:6380}

  cloud:
    gateway:
      server:
        webflux:
          # 1. CORS 설정
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "https://comatching.site"
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                  - "http://localhost:5500"
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: "*"
                allowCredentials: true

          # 2. 라우팅 규칙
          routes:
            - id: item-service-admin-monitor
              uri: http://localhost:9006
              predicates:
                - Path=/admin-payment-monitor.html

            - id: item-service-payment-ws
              uri: http://localhost:9006
              predicates:
                - Path=/ws/payment, /ws/payment/**
              filters:
                - AuthorizationHeaderFilter

            - id: user-service-public
              uri: http://localhost:9000
              predicates:
                - Path=/api/auth/login, /api/auth/signup, /api/auth/signup/nickname/availability, /api/auth/participants, /api/auth/participants/**, /api/auth/email/**, /api/auth/password/code, /api/auth/reissue, /api/profile/tags, /api/hobbies/categories, /api/public/profile-images/**, /oauth2/**, /login/**, /default-ui.css

            - id: user-service-protected
              uri: http://localhost:9000
              predicates:
                - Path=/api/auth/signup/profile, /api/auth/logout, /api/auth/password/change, /api/auth/withdraw, /api/members/**, /api/notices/**
              filters:
                - AuthorizationHeaderFilter

            - id: user-service-swagger
              uri: http://localhost:9000
              predicates:
                - Path=/user-doc/**
              filters:
                - RewritePath=/user-doc/(?<segment>.*), /$\{segment}

            - id: matching-service
              uri: http://localhost:9001
              predicates:
                - Path=/api/matching/**
              filters:
                - AuthorizationHeaderFilter

            - id: matching-service-swagger
              uri: http://localhost:9001
              predicates:
                - Path=/matching-doc/**
              filters:
                - RewritePath=/matching-doc/(?<segment>.*), /$\{segment}

            - id: chat-service
              uri: http://localhost:9003
              predicates:
                - Path=/api/chat/**, /ws/**
              filters:
                - AuthorizationHeaderFilter

            - id: chat-service-swagger
              uri: http://localhost:9003
              predicates:
                - Path=/chat-doc/**
              filters:
                - RewritePath=/chat-doc/(?<segment>.*), /$\{segment}

            - id: item-service
              uri: http://localhost:9006
              predicates:
                - Path=/api/items/**
              filters:
                - AuthorizationHeaderFilter

            - id: notification-service
              uri: http://localhost:9005
              predicates:
                - Path=/api/fcm/**
              filters:
                - AuthorizationHeaderFilter

            - id: admin-user-notice
              uri: http://localhost:9000
              predicates:
                - Path=/api/v1/admin/users/**, /api/v1/admin/notices/**
              filters:
                - AuthorizationHeaderFilter

            - id: admin-payment-product-items
              uri: http://localhost:9006
              predicates:
                - Path=/api/v1/admin/shop/**, /api/v1/admin/payment/**
              filters:
                - AuthorizationHeaderFilter


          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

jwt:
  secret: ${JWT_SECRET}
  access-token:
    expiration: ${ACCESS_TOKEN_EXP:86400000}
  refresh-token:
    expiration: ${REFRESH_TOKEN_EXP:604800000}

logging:
  level:
    org.springframework.cloud.gateway: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # percentiles(서비스별 고정 분위수)가 아니라 histogram 버킷을 내보낸다.
      # 전자는 인스턴스 간 합산이 불가능해 전체 p95를 뽑을 수 없다.
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s