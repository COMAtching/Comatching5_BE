# 로컬 환경: 노트북 MySQL과 localhost 서비스. SPRING_PROFILES_ACTIVE=local
user-service:
  url: http://localhost:9000

matching-service:
  url: http://localhost:9001

spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      database: comatching_chat
      uri: mongodb://localhost:27017/comatching_chat
  # 로컬 Redis/Kafka/JPA 설정 (common-module 소유)
  config:
    import: classpath:local-infrastructure.yml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # 상태 상세 노출 여부는 실행 환경별로 지정한다.
      show-details: always
