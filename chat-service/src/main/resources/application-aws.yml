# AWS 환경 설정 - Docker 컨테이너 간 통신용
server:
  port: 9003

user-service:
  url: http://user-service:9000

matching-service:
  url: http://matching-service:9001

spring:
  application:
    name: chat-service

  data:
    mongodb:
      host: mongodb
      port: 27017
      database: comatching_chat
      auto-index-creation: true
    redis:
      host: ${REDIS_ENDPOINT}
      port: 6379
      ssl:
        enabled: true

  kafka:
    bootstrap-servers: kafka:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: chat-service-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${AWS_S3_BUCKET}

jwt:
  secret: ${JWT_SECRET}
  access-token:
    expiration: ${ACCESS_TOKEN_EXP:86400000}
  refresh-token:
    expiration: ${REFRESH_TOKEN_EXP:604800000}

internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health

# 재시도를 다 쓴 메시지를 옮길 DLT 토픽(<토픽>.DLT)을 기동 시 만든다.
# 이 서비스가 소비하는 토픽만 적는다.
comatching:
  kafka:
    dlt-topics: matching-success-topic
