# 공통 설정만 정의한다. 프로파일은 env의 SPRING_PROFILES_ACTIVE로 선택한다.
server:
  port: 9000
  servlet:
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID
        path: /
        http-only: true

auth:
  cookie:
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

comatching:
  outbox:
    cleanup-target: MEMBER
    cleanup-cron: "0 0 3 * * *"  # Asia/Seoul
    poll-interval-ms: 1000
  profile:
    default-images:
      filenames:
        - default.png
        - animal_dog_male1.png
        - animal_cat_female1.png
        - animal_dinosaur1.png

spring:
  application:
    name: user-service
  datasource:
    hikari:
      pool-name: HikariPool-${spring.application.name}
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
      validation-timeout: 5000
  jpa:
    properties:
      default_batch_fetch_size: 100
  data:
    web:
      pageable:
        max-page-size: 10000
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.comatching.common.config.kafka.EventValueSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
    consumer:
      group-id: user-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      type: single
      ack-mode: record
      concurrency: 1
  mail:
    host: smtp.gmail.com
    port: 587
    username: catholicalarm2@gmail.com
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${AWS_S3_BUCKET}
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - openid
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v1/oidc/userinfo
            issuer-uri: https://kauth.kakao.com
            user-name-attribute: sub

jwt:
  secret: ${JWT_SECRET}
  access-token:
    expiration: ${ACCESS_TOKEN_EXP:86400000}
  refresh-token:
    expiration: ${REFRESH_TOKEN_EXP:604800000}

internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:}

kakao:
  auth:
    admin-key: ${KAKAO_ADMIN_KEY}
    unlink-url: https://kapi.kakao.com/v1/user/unlink
    unlink-content-type: application/x-www-form-urlencoded;charset=utf-8
    unlink-target-id-type: user_id

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # percentiles(서비스별 고정 분위수)가 아니라 histogram 버킷을 내보낸다.
      # 전자는 인스턴스 간 합산이 불가능해 전체 p95를 뽑을 수 없다.
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
