# 로컬 환경: 노트북 MySQL과 localhost 서비스. SPRING_PROFILES_ACTIVE=local
server:
  servlet:
    session:
      cookie:
        secure: false

client:
  url: ${CLIENT_URL:http://localhost:3000}

item-service:
  url: ${ITEM_SERVICE_URL:http://localhost:9006}

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
    domain: ${AUTH_COOKIE_DOMAIN:}

comatching:
  profile:
    default-images:
      base-url: ${DEFAULT_PROFILE_IMAGE_BASE_URL:http://localhost:8080/api/public/profile-images/}

operations:
  initially-closed: ${OPERATIONS_INITIALLY_CLOSED:}

spring:
  datasource:
    url: jdbc:mysql://${LOCAL_MYSQL_HOST:127.0.0.1}:${LOCAL_MYSQL_PORT:3306}/comatching_user?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${LOCAL_MYSQL_USERNAME:root}
    password: ${LOCAL_MYSQL_PASSWORD:}
  jpa:
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            # 카카오 callback은 프론트 주소 CLIENT_URL과 분리한다.
            redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}
  config:
    import: classpath:local-infrastructure.yml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # 상태 상세 노출 여부는 실행 환경별로 지정한다.
      show-details: always
