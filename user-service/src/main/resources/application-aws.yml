# AWS 환경 설정 - Docker 컨테이너 간 통신용
server:
  port: 9000
  servlet:
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        secure: true

client:
  url: ${CLIENT_URL:https://comatching.site}

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}
    domain: ${AUTH_COOKIE_DOMAIN:comatching.site}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

comatching:
  profile:
    default-images:
      base-url: ${DEFAULT_PROFILE_IMAGE_BASE_URL:https://srv.comatching.site/api/public/profile-images/}
      filenames:
        - "default.png"
        - "animal_dog_male1.png"
        - "animal_cat_female1.png"
        - "animal_dinosaur1.png"

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://${RDS_ENDPOINT}:3306/comatching_user?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=true&requireSSL=true
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    hikari:
      pool-name: HikariPool-${spring.application.name}
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
      validation-timeout: 5000

  jpa:
    hibernate:
      # 첫 배포는 JPA_DDL_AUTO=create 로 스키마를 만들고, 그 뒤에는 값을 빼서
      # validate 로 돌린다. update 를 상시로 두면 엔티티를 고칠 때마다 앱이
      # 운영 스키마를 말없이 바꾸고, 그 변경은 되돌릴 수단이 없다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_ENDPOINT}
      port: 6379
      ssl:
        # ElastiCache(전송 중 암호화 켬)면 true, EC2 컨테이너 Redis 면 false.
        enabled: ${REDIS_SSL_ENABLED:true}

  kafka:
    bootstrap-servers: kafka:29092
    admin:
      # KafkaAdmin 은 기동 시 선언된 토픽을 만든다. 기본값(false)이면 브로커에
      # 못 붙어도 경고만 남기고 앱이 정상 기동해서, 토픽이 없는 채로 "성공한"
      # 배포가 되고 발행·구독이 런타임에 조용히 실패한다. true 면 그 자리에서
      # 컨텍스트 로딩이 깨져 배포 시점에 드러난다.
      fail-fast: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: user-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  mail:
    host: smtp.gmail.com
    port: 587
    username: catholicalarm2@gmail.com
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${AWS_S3_BUCKET}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: https://srv.comatching.site/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - openid

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v1/oidc/userinfo
            issuer-uri: https://kauth.kakao.com
            user-name-attribute: sub

jwt:
  secret: ${JWT_SECRET}
  access-token:
    expiration: ${ACCESS_TOKEN_EXP:86400000}
  refresh-token:
    expiration: ${REFRESH_TOKEN_EXP:604800000}

internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:}

kakao:
  auth:
    admin-key: ${KAKAO_ADMIN_KEY}
    unlink-url: https://kapi.kakao.com/v1/user/unlink
    unlink-content-type: application/x-www-form-urlencoded;charset=utf-8
    unlink-target-id-type: user_id

management:
  endpoints:
    web:
      exposure:
        # 컨테이너 밖(호스트 포트 매핑·게이트웨이 라우트)으로 나가는 길이
        # 없는 포트라 그대로 연다. Prometheus 가 컴포즈 네트워크 안에서 긁는다.
        include: health,prometheus
  endpoint:
    health:
      # base 프로파일의 always 를 여기서 덮는다. 상속되면 구성요소 상태가
      # 인증 없이 그대로 드러난다.
      show-details: never