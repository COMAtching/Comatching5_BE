# AWS 환경: RDS와 Docker 서비스 주소. SPRING_PROFILES_ACTIVE=aws
server:
  servlet:
    session:
      cookie:
        secure: true

client:
  url: ${CLIENT_URL:https://comatching.site}

item-service:
  url: http://item-service:9006

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}
    domain: ${AUTH_COOKIE_DOMAIN:comatching.site}

comatching:
  profile:
    default-images:
      base-url: ${DEFAULT_PROFILE_IMAGE_BASE_URL:https://srv.comatching.site/api/public/profile-images/}

spring:
  datasource:
    url: jdbc:mysql://${RDS_ENDPOINT}:3306/comatching_user?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=true&requireSSL=true
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
  jpa:
    hibernate:
      # 운영은 기본 validate. create/create-drop은 기존 스키마를 삭제하므로 일반 기동에 사용하지 않는다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
  data:
    redis:
      host: ${REDIS_ENDPOINT}
      port: 6379
      ssl:
        # ElastiCache(전송 중 암호화 켬)면 true, EC2 컨테이너 Redis 면 false.
        enabled: ${REDIS_SSL_ENABLED:true}
  kafka:
    bootstrap-servers: kafka:29092
    admin:
      # KafkaAdmin 은 기동 시 선언된 토픽을 만든다. 기본값(false)이면 브로커에
      # 못 붙어도 경고만 남기고 앱이 정상 기동해서, 토픽이 없는 채로 "성공한"
      # 배포가 되고 발행·구독이 런타임에 조용히 실패한다. true 면 그 자리에서
      # 컨텍스트 로딩이 깨져 배포 시점에 드러난다.
      fail-fast: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            # 카카오 callback은 프론트 주소 CLIENT_URL과 분리한다.
            redirect-uri: ${KAKAO_REDIRECT_URI:https://srv.comatching.site/login/oauth2/code/kakao}

management:
  endpoints:
    web:
      exposure:
        # 컨테이너 밖(호스트 포트 매핑·게이트웨이 라우트)으로 나가는 길이
        # 없는 포트라 그대로 연다. Prometheus 가 컴포즈 네트워크 안에서 긁는다.
        include: health,prometheus
  endpoint:
    health:
      # 상태 상세 노출 여부는 실행 환경별로 지정한다.
      show-details: never
