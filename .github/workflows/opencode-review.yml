# PR 이 열리거나 갱신될 때 opencode 가 자동으로 코드 리뷰를 남긴다.
# 리뷰 기준은 docs/code-review-guidelines.md 한 곳에서 관리한다 - 프롬프트에
# 기준을 복붙해 두면 워크플로와 문서가 따로 놀기 시작한다.
#
# 수동 트리거(PR 코멘트에 /oc)는 opencode.yml 이 따로 담당한다.
name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 같은 PR 에 연속으로 푸시하면 이전 리뷰는 취소한다. synchronize 가 푸시마다
# 발화하므로, 없으면 커밋 3개를 연달아 밀 때 API 요금을 3번 낸다.
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 초안 PR 은 아직 볼 준비가 안 된 코드다.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      # 리뷰 코멘트를 남기려면 read 로는 부족하다.
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          # 리뷰는 base..head 차이를 봐야 하므로 얕은 체크아웃으로는 부족하다.
          fetch-depth: 0
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          # provider 등록 자체는 opencode.json 이 한다. 여기서는 키만 넘기는데,
          # models.dev 가 Google provider 에 등록해 둔 이름이 셋이라 어느
          # 쪽을 읽든 걸리도록 모두 채운다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: google/gemini-3.5-flash
          use_github_token: true
          prompt: |
            이 PR 의 변경분(base 브랜치 대비)을 코드 리뷰해라.

            리뷰 기준은 저장소의 `docs/code-review-guidelines.md` 에 있다.
            먼저 그 파일을 읽고, 거기 적힌 페르소나·언어·관점을 그대로 따라라.

            추가 지침:
            - 변경된 코드만 본다. 기존 코드의 문제는 이번 변경이 건드린
              경우에만 지적한다.
            - 확신이 없으면 단정하지 말고 질문 형태로 남긴다.
            - 지적할 게 없으면 억지로 만들지 말고 "특이사항 없음"이라고 답한다.
            - 이 저장소는 Spring 기반 MSA 다. 서비스 경계를 넘는 변경
              (common-module, 서비스 간 내부 API, Kafka 이벤트 스키마)은
              하위 호환성을 특히 주의해서 본다.
