# PR·이슈 코멘트에서 Claude 를 직접 부른다. 자동 리뷰(claude-code-review.yml)와
# 달리 사람이 명시적으로 부를 때만 돈다.
#
#   @claude ChatRoomPresenceTracker 가 동시성 안전한지 봐줘
#   @claude 이 테스트 깨지는 원인 찾아줘
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # 러너가 관계없는 코멘트마다 뜨는 것을 막는다. 액션 자체도 트리거
    # 문구를 다시 확인한다.
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # PR 의 CI 결과를 읽게 한다.
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
