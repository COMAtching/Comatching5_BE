# PR·이슈 코멘트에서 opencode 를 직접 부른다. 자동 리뷰(opencode-review.yml)와
# 달리 사람이 명시적으로 부를 때만 돈다.
#
#   /oc 이 부분 왜 이렇게 짰는지 설명해줘
#   /opencode 이 테스트 깨지는 원인 찾아줘
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          # provider 등록 자체는 opencode.json 이 한다. 여기서는 키만 넘기는데,
          # models.dev 가 Google provider 에 등록해 둔 이름이 셋이라 어느
          # 쪽을 읽든 걸리도록 모두 채운다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: google/gemini-3.5-flash
          use_github_token: true
