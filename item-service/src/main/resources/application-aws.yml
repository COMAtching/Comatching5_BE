# AWS 환경: RDS와 Docker 서비스 주소. SPRING_PROFILES_ACTIVE=aws
member-service:
  url: http://user-service:9000

user-service:
  url: http://user-service:9000

spring:
  datasource:
    url: jdbc:mysql://${RDS_ENDPOINT}:3306/comatching_item?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=true&requireSSL=true
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
  jpa:
    hibernate:
      # 운영은 기본 validate. create/create-drop은 기존 스키마를 삭제하므로 일반 기동에 사용하지 않는다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
  kafka:
    # 3노드 클러스터. 하나만 적어도 나머지를 찾아가지만, 그 하나가 죽어 있으면
    # 기동 시 접속 자체를 못 하므로 셋 다 적는다.
    bootstrap-servers: kafka-1:29092,kafka-2:29092,kafka-3:29092
    admin:
      # KafkaAdmin 은 기동 시 선언된 토픽을 만든다. 기본값(false)이면 브로커에
      # 못 붙어도 경고만 남기고 앱이 정상 기동해서, 토픽이 없는 채로 "성공한"
      # 배포가 되고 발행·구독이 런타임에 조용히 실패한다. true 면 그 자리에서
      # 컨텍스트 로딩이 깨져 배포 시점에 드러난다.
      fail-fast: true
  data:
    redis:
      host: ${REDIS_ENDPOINT}
      port: 6379
      ssl:
        # ElastiCache(전송 중 암호화 켬)면 true, EC2 컨테이너 Redis 면 false.
        enabled: ${REDIS_SSL_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        # 컨테이너 밖(호스트 포트 매핑·게이트웨이 라우트)으로 나가는 길이
        # 없는 포트라 그대로 연다. Prometheus 가 컴포즈 네트워크 안에서 긁는다.
        include: health,prometheus
  endpoint:
    health:
      # 상태 상세 노출 여부는 실행 환경별로 지정한다.
      show-details: never

# 운영은 3노드 클러스터라 코드가 선언하는 토픽(NewTopic)과 DLT 의 복제 수를 3으로 둔다.
# 로컬(브로커 1대)은 기본값 1을 쓴다. 나머지 comatching.kafka 값은 application.yml 에 있다.
comatching:
  kafka:
    replication-factor: 3
