# AWS 환경 설정 - Docker 컨테이너 간 통신용
server:
  port: 9006

member-service:
  url: http://user-service:9000

user-service:
  url: http://user-service:9000

spring:
  application:
    name: item-service

  datasource:
    url: jdbc:mysql://${RDS_ENDPOINT}:3306/comatching_item?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=true&requireSSL=true
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    hikari:
      pool-name: HikariPool-${spring.application.name}
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
      validation-timeout: 5000

  jpa:
    hibernate:
      # 첫 배포는 JPA_DDL_AUTO=create 로 스키마를 만들고, 그 뒤에는 값을 빼서
      # validate 로 돌린다. update 를 상시로 두면 엔티티를 고칠 때마다 앱이
      # 운영 스키마를 말없이 바꾸고, 그 변경은 되돌릴 수단이 없다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false

  data:
    redis:
      host: ${REDIS_ENDPOINT}
      port: 6379
      ssl:
        # ElastiCache(전송 중 암호화 켬)면 true, EC2 컨테이너 Redis 면 false.
        enabled: ${REDIS_SSL_ENABLED:true}

  kafka:
    bootstrap-servers: kafka:29092
    admin:
      # KafkaAdmin 은 기동 시 선언된 토픽을 만든다. 기본값(false)이면 브로커에
      # 못 붙어도 경고만 남기고 앱이 정상 기동해서, 토픽이 없는 채로 "성공한"
      # 배포가 되고 발행·구독이 런타임에 조용히 실패한다. true 면 그 자리에서
      # 컨텍스트 로딩이 깨져 배포 시점에 드러난다.
      fail-fast: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: item-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${AWS_S3_BUCKET}

jwt:
  secret: ${JWT_SECRET}
  access-token:
    expiration: ${ACCESS_TOKEN_EXP:86400000}
  refresh-token:
    expiration: ${REFRESH_TOKEN_EXP:604800000}

internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:}

comatching:
  order:
    expire-minutes: ${ORDER_EXPIRE_MINUTES:43200}
  pre-signup:
    matching-ticket-grant:
      enabled: ${PRE_SIGNUP_MATCHING_TICKET_GRANT_ENABLED:true}
      quantity: ${PRE_SIGNUP_MATCHING_TICKET_GRANT_QUANTITY:1}
      campaign-code: ${PRE_SIGNUP_MATCHING_TICKET_GRANT_CAMPAIGN_CODE:PRE_SIGNUP_2026}
  kafka:
    # 재시도를 다 쓴 메시지를 옮길 DLT 토픽(<토픽>.DLT)을 기동 시 만든다.
    # 이 서비스가 소비하는 토픽만 적는다.
    dlt-topics: member-signup
    # DLT 적재를 알릴 웹훅(Discord/Slack 겸용). 비우면 로그만 남는다.
    dlt-alert-webhook-url: ${DLT_ALERT_WEBHOOK_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # base 프로파일의 always 를 여기서 덮는다. 상속되면 구성요소 상태가
      # 인증 없이 그대로 드러난다.
      show-details: never
