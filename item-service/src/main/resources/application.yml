# 공통 설정만 정의한다. 프로파일은 env의 SPRING_PROFILES_ACTIVE로 선택한다.
server:
  port: 9006

spring:
  application:
    name: item-service
  datasource:
    hikari:
      pool-name: HikariPool-${spring.application.name}
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
      validation-timeout: 5000
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.comatching.common.config.kafka.EventValueSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
    consumer:
      group-id: item-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      type: single
      ack-mode: record
      concurrency: 1
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${AWS_S3_BUCKET}
  # Feign 내부 호출 타임아웃 공통값 (common-module 소유)
  config:
    import: classpath:feign-resilience.yml

jwt:
  secret: ${JWT_SECRET}
  access-token:
    expiration: ${ACCESS_TOKEN_EXP:86400000}
  refresh-token:
    expiration: ${REFRESH_TOKEN_EXP:604800000}

internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:}

comatching:
  outbox:
    cleanup-target: ORDER
    cleanup-cron: "0 20 3 * * *"  # Asia/Seoul
  order:
    expire-minutes: ${ORDER_EXPIRE_MINUTES:43200}
  pre-signup:
    matching-ticket-grant:
      # 사전가입 이벤트는 종료됐다. 기본값을 꺼 두고, 다시 열 때만 env 로 켠다.
      # 가입 이벤트(member-signup) 자체는 환영 메일도 쓰므로 발행 쪽은 건드리지 않는다.
      # 끈 상태에서도 리스너는 메시지를 읽고 넘긴다(오프셋 진행) - 나중에 켜도
      # 꺼져 있던 동안의 가입자에게 소급 지급하지 않는다.
      enabled: ${PRE_SIGNUP_MATCHING_TICKET_GRANT_ENABLED:false}
      quantity: ${PRE_SIGNUP_MATCHING_TICKET_GRANT_QUANTITY:1}
      campaign-code: ${PRE_SIGNUP_MATCHING_TICKET_GRANT_CAMPAIGN_CODE:PRE_SIGNUP_2026}
  kafka:
    # 그룹별 DLT와 전용 replay 토픽을 기동 시 만든다.
    # KafkaEventRoute에 등록된 이 서비스의 처리 경로만 적는다.
    dlt-routes: PRE_SIGNUP_ITEM
    # DLT 적재를 알릴 웹훅(Discord/Slack 겸용). 비우면 로그만 남는다.
    dlt-alert-webhook-url: ${DLT_ALERT_WEBHOOK_URL:}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # percentiles(서비스별 고정 분위수)가 아니라 histogram 버킷을 내보낸다.
      # 전자는 인스턴스 간 합산이 불가능해 전체 p95를 뽑을 수 없다.
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
